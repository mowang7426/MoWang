name: Auto Upload Deb

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev

      - name: 同步远端
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main

      - name: 生成软件源索引
        run: |
          dpkg-scanpackages debs /dev/null | gzip -9c > Packages.gz
          dpkg-scanpackages debs /dev/null > Packages

      - name: 生成 Release
        run: |
          cat > Release << EOF
          Origin: MoWang
          Label: MoWang
          Suite: stable
          Version: 1.0
          Codename: iphoneos
          Architecture: iphoneos-arm iphoneos-arm64 iphoneos-arm64e
          Description: MoWang repo
          EOF

      - name: 提交索引变更
        run: |
          git add Packages Packages.gz Release
          git commit -m "chore: rebuild repository indexes" || echo "No changes to commit"
          git push

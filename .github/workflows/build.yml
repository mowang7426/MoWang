name: Build MoWang Repo

on:
  push:
    branches: [main]
    paths:
      - 'debs/**'
      - 'build.sh'
      - 'check-debs.sh'
      - 'validate-repo.sh'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev bzip2 xz-utils zstd

      - name: Build repository indexes
        run: ./build.sh

      - name: Validate repository
        run: ./validate-repo.sh

      - name: Commit generated indexes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Packages Packages.gz Packages.bz2 Packages.xz Packages.zst Release
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "build: regenerate repository indexes"
            git push
          fi
